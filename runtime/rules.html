  <style>

    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px}.toolbar-left,.toolbar-right{display:flex;align-items:center;gap:8px}.toolbar h2{font-size:13px;color:#8e8e93;font-weight:600;margin:0}.hint{margin:0 0 14px;padding:10px 12px;border-left:3px solid #0a84ff;border-radius:0 7px 7px 0;background:#1c1c1e;color:#aeaeb2;font-size:12px;line-height:1.55}.hint strong{color:#f5f5f7}

    .group{border:1px solid #2c2c2e;border-radius:8px;background:#1c1c1e;overflow:hidden}.rule-row{display:grid;grid-template-columns:30px minmax(150px,.85fr) minmax(230px,1.5fr) minmax(150px,.8fr) auto;align-items:end;gap:10px;padding:12px 13px;border-top:1px solid #38383a}.rule-row:first-child{border-top:0}
    .rule-index{align-self:center;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#636366;text-align:right}.field{min-width:0}.raw-field{grid-column:2/5}.field label{display:block;margin:0 0 5px;color:#8e8e93;font-size:11px}.control{width:100%;height:38px;border:1px solid transparent;border-radius:7px;background:#2c2c2e;color:#f5f5f7;padding:0 10px;font:13px inherit;outline:none}.control:focus{border-color:#0a84ff;box-shadow:0 0 0 3px rgba(10,132,255,.18)}.control:disabled,.control[readonly]{color:#8e8e93;opacity:1}.raw{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .icon-set{display:flex;gap:3px;align-self:end}.icon{width:34px;height:38px;border:0;border-radius:6px;background:transparent;color:#0a84ff;font-size:17px;cursor:pointer}.icon:hover{background:rgba(10,132,255,.12)}.icon.danger{color:#ff453a}.icon:disabled{color:#48484a;cursor:default;background:transparent}
    .meaning{grid-column:2/5;display:flex;align-items:center;gap:7px;min-width:0;color:#aeaeb2;font-size:12px;line-height:1.45}.meaning:before{content:"";width:6px;height:6px;border-radius:50%;background:#30d158;flex:0 0 auto}.meaning.protected:before{background:#ffd60a}.badge{padding:2px 5px;border-radius:4px;background:#3a3320;color:#ffd60a;font-size:10px;white-space:nowrap}
    .button{height:36px;border:0;border-radius:7px;padding:0 13px;font:600 13px inherit;cursor:pointer}.primary{background:#0a84ff;color:#fff}.secondary{background:#2c2c2e;color:#f5f5f7}.button:disabled{opacity:.5;cursor:default}
    .footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}.status{min-height:20px;color:#30d158;font-size:13px}.status.error{color:#ff6961}.empty{padding:28px;text-align:center;color:#8e8e93}
    .route-preview{margin:0 0 18px;border:1px solid #2c2c2e;border-radius:8px;background:#1c1c1e;overflow:hidden}.route-preview-head{padding:14px 15px;border-bottom:1px solid #38383a}.route-preview h2{margin:0;font-size:15px}.route-preview p{margin:5px 0 0;color:#8e8e93;font-size:12px;line-height:1.5}.route-preview-form{display:flex;gap:8px;padding:12px}.route-preview-form input{min-width:0;flex:1;height:38px;border:1px solid #48484a;border-radius:7px;background:#2c2c2e;color:#f5f5f7;padding:0 11px;font:14px inherit;outline:none}.route-preview-form input:focus{border-color:#0a84ff;box-shadow:0 0 0 3px rgba(10,132,255,.18)}.route-preview-result{display:none;margin:0 12px 12px;padding:12px;border-radius:7px;background:#2c2c2e}.route-preview-result.show{display:block}.preview-state{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:650}.preview-state:before{content:"";width:7px;height:7px;border-radius:50%;background:#8e8e93}.preview-state.known:before{background:#30d158}.preview-state.runtime:before{background:#ffd60a}.preview-state.error:before{background:#ff6961}.preview-detail{margin-top:6px;color:#aeaeb2;font-size:12px;line-height:1.55}.preview-rule{margin-top:9px;padding:8px 9px;border:1px solid #48484a;border-radius:6px;background:#1c1c1e;color:#d1d1d6;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}.preview-note{margin-top:8px;color:#8e8e93;font-size:11px;line-height:1.5}
    .card-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.rule-card{min-height:202px;border:1px solid #38383a;border-radius:8px;background:#1c1c1e;overflow:hidden;display:flex;flex-direction:column}.rule-card.direct{border-color:rgba(48,209,88,.48)}.rule-card.default{border-color:rgba(255,214,10,.45)}.rule-card-head{padding:16px 16px 13px;border-bottom:1px solid #38383a}.rule-card-head h3{margin:0;color:#f5f5f7;font-size:16px;font-weight:650}.rule-card-head p{margin:5px 0 0;color:#8e8e93;font-size:12px;line-height:1.45}.card-facts{padding:13px 16px;display:grid;gap:10px}.card-fact{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#aeaeb2;font-size:12px}.card-fact strong{font-weight:600;color:#f5f5f7}.route-badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 8px;background:rgba(10,132,255,.17);color:#58a6ff;font-size:11px;font-weight:650;white-space:nowrap}.route-badge.direct{background:rgba(48,209,88,.14);color:#30d158}.route-badge.default{background:rgba(255,214,10,.14);color:#ffd60a}.card-rules{margin:0 16px;color:#8e8e93;font-size:11px;line-height:1.5;min-height:32px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.card-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding:12px 16px;border-top:1px solid #38383a}.card-order{color:#636366;font-size:11px}.text-button{height:30px;border:0;border-radius:6px;padding:0 10px;background:rgba(10,132,255,.14);color:#0a84ff;font:600 12px inherit;cursor:pointer}.text-button:hover{background:rgba(10,132,255,.23)}
    .card-actions{display:flex;align-items:center;gap:6px}.card-action{width:30px;height:30px;border:0;border-radius:6px;background:#2c2c2e;color:#0a84ff;font-size:16px;line-height:1;cursor:pointer}.card-action:hover{background:rgba(10,132,255,.22)}.card-action.danger{color:#ff6961}.card-action.danger:hover{background:rgba(255,69,58,.15)}.card-action:disabled{color:#636366;cursor:not-allowed}.card-action:disabled:hover{background:#2c2c2e}
    dialog{width:min(860px,calc(100% - 28px));max-height:min(760px,calc(100vh - 32px));padding:0;border:1px solid #48484a;border-radius:10px;background:#1c1c1e;color:#f5f5f7;box-shadow:0 24px 80px rgba(0,0,0,.62)}dialog::backdrop{background:rgba(0,0,0,.68);backdrop-filter:blur(2px)}.dialog-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:18px 20px 15px;border-bottom:1px solid #38383a}.dialog-head h2{margin:0;font-size:18px}.dialog-head p{margin:5px 0 0;color:#8e8e93;font-size:12px;line-height:1.5}.dialog-close{width:32px;height:32px;border:0;border-radius:6px;background:#2c2c2e;color:#aeaeb2;font-size:20px;cursor:pointer}.dialog-body{max-height:calc(min(760px,100vh - 32px) - 147px);overflow:auto;padding:15px 20px}.editor-rule{border:1px solid #38383a;border-radius:8px;background:#202023;padding:13px;margin-bottom:10px}.editor-rule.locked{opacity:.72}.editor-rule-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.editor-rule-number{color:#8e8e93;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}.editor-fields{display:grid;grid-template-columns:minmax(150px,.8fr) minmax(200px,1.4fr) minmax(150px,.8fr);gap:9px}.editor-fields .field label{font-size:11px}.editor-actions{display:flex;justify-content:flex-end;margin-top:10px}.editor-note{margin:0 0 12px;color:#8e8e93;font-size:12px;line-height:1.5}.dialog-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 20px;border-top:1px solid #38383a}.dialog-foot .toolbar-right{margin-left:auto}.create-form{display:grid;grid-template-columns:minmax(150px,.8fr) minmax(200px,1.4fr) minmax(150px,.8fr);gap:9px}.advanced-only{display:none}.advanced-mode .advanced-only{display:inline-flex}
    @media(max-width:800px){.topbar-inner{height:auto;padding:10px 14px;align-items:flex-start;flex-direction:column;gap:8px}.nav{width:100%;display:grid;grid-template-columns:repeat(5,1fr)}.nav a{text-align:center;padding:7px 5px;white-space:normal}.wrap{padding:28px 14px 50px}.intro{align-items:flex-start;flex-direction:column}.toolbar{align-items:stretch;flex-direction:column}.toolbar-left,.toolbar-right{justify-content:space-between}.toolbar-right .button{flex:1}.rule-row{grid-template-columns:27px minmax(0,1fr);align-items:start;padding:12px 10px}.rule-index{grid-row:1/5;padding-top:31px}.field,.raw-field,.meaning,.icon-set{grid-column:2}.meaning{grid-row:auto}.icon-set{justify-content:flex-end}.footer{align-items:stretch;flex-direction:column}.footer .button{width:100%}.route-preview-form{flex-direction:column}.route-preview-form .button{width:100%}.card-grid{grid-template-columns:1fr}.editor-fields,.create-form{grid-template-columns:1fr}.dialog-head,.dialog-foot{padding-left:14px;padding-right:14px}.dialog-body{padding:14px}.dialog-foot{align-items:stretch;flex-direction:column}.dialog-foot .toolbar-right{margin-left:0}.dialog-foot .button{flex:1}}
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar-inner"><div class="brand">家庭旁路</div><nav class="nav"><a href="/">设备</a><a href="/dns/">DNS</a><a href="/airport/">机场与候选池</a><a class="active" href="/rules">规则</a><a href="/mihomo-maintenance">维护</a></nav></div></header>
  <main class="wrap" id="app">
    <div class="intro"><div><h1>代理规则</h1><p>选择访问对象和访问方式，无需记忆 Mihomo 语法。</p></div><div class="count" id="count">正在载入</div></div>
    <div class="toolbar"><div class="toolbar-left"><h2>从上到下依次匹配</h2><label class="mode"><input id="advanced" type="checkbox" onchange="toggleAdvanced(this.checked)"><span>高级模式</span></label></div><div class="toolbar-right"><button class="button secondary" onclick="reloadRules()">重新载入</button><button class="button primary" onclick="openCreateRule()">新增规则</button></div></div>
    <p class="hint"><strong>卡片只做清晰汇总，实际匹配顺序不会改变。</strong>打开卡片可编辑其中规则；需要调整不同卡片之间的优先级时，再开启高级模式。直连只控制 Mihomo 的出口选择，新增直连规则会自动排在通用中国规则之前。</p>
    <section class="route-preview" aria-labelledby="route-preview-title"><div class="route-preview-head"><h2 id="route-preview-title">规则命中预览</h2><p>输入域名或网址，查看当前规则中可确定的第一条命中。Geosite、GEOIP 和 IP 网段依赖 Mihomo 运行时数据，会明确标为“运行时判断”，不会冒充确定结果。</p></div><div class="route-preview-form"><input id="route-target" inputmode="url" autocomplete="off" placeholder="例如 chatgpt.com 或 https://www.youtube.com/watch?v=…" aria-label="要预览的域名或网址"><button class="button primary" onclick="previewRoute()">查看路径</button></div><div id="route-preview-result" class="route-preview-result" aria-live="polite"></div></section>
    <div class="card-grid" id="rules"><div class="empty">正在读取规则</div></div>
    <div class="footer"><div class="status" id="status"></div><div class="toolbar-right"><button class="button secondary advanced-only" onclick="addRule()">添加代理规则</button><button class="button secondary advanced-only" onclick="addDirectRule()">添加直连域名</button><button class="button primary" id="save" onclick="saveRules()" disabled>校验并应用</button></div></div>
  </main>
  <dialog id="rule-dialog" aria-labelledby="rule-dialog-title"><div class="dialog-head"><div><h2 id="rule-dialog-title">编辑规则</h2><p id="rule-dialog-description"></p></div><button class="dialog-close" type="button" onclick="closeRuleDialog()" aria-label="关闭">×</button></div><div class="dialog-body" id="rule-dialog-body"></div><div class="dialog-foot"><div class="status" id="dialog-status"></div><div class="toolbar-right"><button class="button secondary" type="button" onclick="closeRuleDialog()">完成编辑</button><button class="button primary" type="button" onclick="saveRules(true)">校验并应用</button></div></div></dialog>
  <datalist id="category-options"><option value="apple"><option value="microsoft"><option value="openai"><option value="telegram"><option value="tiktok"><option value="youtube"><option value="google"><option value="CN"></datalist>
  <script>
    const csrf="__CSRF__",app=document.querySelector('#app'),list=document.querySelector('#rules'),statusEl=document.querySelector('#status'),saveButton=document.querySelector('#save'),countEl=document.querySelector('#count');
    const typeLabels={DOMAIN:'单个域名','DOMAIN-SUFFIX':'域名及子域名','DOMAIN-KEYWORD':'域名关键词',GEOSITE:'网站分类','IP-CIDR':'IPv4 网段','IP-CIDR6':'IPv6 网段',GEOIP:'IP 国家或地区',MATCH:'其他所有流量'};
    const simpleTypes=new Set(Object.keys(typeLabels));
    let rules=[],version='',policies=[],protectedRules=new Set(),dirty=false,advanced=false,activeCardKey=null,creatingRule=false;
    function esc(value){return String(value??'').replace(/[&<>"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[char]))}
    function policyLabel(value){return {DIRECT:'直连（不经机场）',REJECT:'拦截',"REJECT-DROP":'静默拦截',PASS:'继续匹配',Others:'默认代理',Youtube:'YouTube',AI:'AI',Telegram:'Telegram',Google:'Google',Gemini:'Gemini',Apple:'Apple',MicroSoft:'Microsoft',TikTok:'TikTok'}[value]||value}
    function parseRule(raw){let parts=raw.split(','),type=(parts[0]||'').toUpperCase();if(type==='MATCH'&&parts.length===2)return{type,value:'',policy:parts[1],extra:[]};if(simpleTypes.has(type)&&type!=='MATCH'&&parts.length>=3)return{type,value:parts[1],policy:parts[2],extra:parts.slice(3)};return{type:'RAW',raw}}
    function serialize(model){if(model.type==='RAW')return model.raw;if(model.type==='MATCH')return`MATCH,${model.policy||'Others'}`;return[model.type,model.value||'',model.policy||'Others',...(model.extra||[])].join(',')}
    function typeOption(value,current){return`<option value="${value}" ${value===current?'selected':''}>${typeLabels[value]}</option>`}
    function policyOption(value,current){return`<option value="${esc(value)}" ${value===current?'selected':''}>${esc(policyLabel(value))}</option>`}
    function objectText(model){if(model.type==='MATCH')return'未被前面规则匹配的流量';let value=`「${model.value||'未填写'}」`;return{DOMAIN:`域名 ${value}`,"DOMAIN-SUFFIX":`${value} 及其子域名`,"DOMAIN-KEYWORD":`域名中包含 ${value}`,GEOSITE:`网站分类 ${value}`,"IP-CIDR":`IPv4 网段 ${value}`,"IP-CIDR6":`IPv6 网段 ${value}`,GEOIP:`${value} 地区的 IP`}[model.type]||value}
    function actionText(policy){if(policy==='DIRECT')return'通过本地网络直连，不经过机场代理';if(policy==='REJECT'||policy==='REJECT-DROP')return'拦截';if(policy==='PASS')return'继续匹配下一层';return`使用「${policyLabel(policy)}」`}
    function explanation(model){return`访问 ${objectText(model)} 时，${actionText(model.policy)}`}
    function normalizePreviewHost(value){let raw=String(value||'').trim();if(!raw)throw Error('请输入域名或网址');if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(raw))raw='https://'+raw;let host;try{host=new URL(raw).hostname.toLowerCase().replace(/\.$/,'')}catch(error){throw Error('请输入有效的域名或网址')}if(!host||host.includes(':')||/^\d{1,3}(?:\.\d{1,3}){3}$/.test(host))throw Error('此预览仅接受域名；IP 地址需要由 Mihomo 在运行时按 IP 规则判断');return host}
    function knownGeoMatch(category,host){let suffixes={apple:['apple.com','icloud.com','icloud-content.com','mzstatic.com'],microsoft:['microsoft.com','office.com','live.com','windows.com','microsoftonline.com','xbox.com'],openai:['openai.com','chatgpt.com','oaistatic.com','oaiusercontent.com'],telegram:['telegram.org','telegram.me','t.me','telegra.ph','telegram.dog'],tiktok:['tiktok.com','tiktokcdn.com','tiktokv.com','byteoversea.com','ibytedtos.com'],youtube:['youtube.com','youtu.be','googlevideo.com','ytimg.com'],google:['google.com','googleapis.com','gstatic.com','googleusercontent.com']};let list=suffixes[String(category||'').toLowerCase()]||[];return list.some(suffix=>host===suffix||host.endsWith('.'+suffix))}
    function domainRuleMatches(model,host){if(model.type==='DOMAIN')return host===String(model.value||'').toLowerCase();if(model.type==='DOMAIN-SUFFIX'){let suffix=String(model.value||'').toLowerCase().replace(/^\./,'');return host===suffix||host.endsWith('.'+suffix)}if(model.type==='DOMAIN-KEYWORD')return host.includes(String(model.value||'').toLowerCase());if(model.type==='GEOSITE')return knownGeoMatch(model.value,host);return false}
    function previewResult(state,title,detail,rule,note=''){let result=document.querySelector('#route-preview-result');result.className='route-preview-result show';result.innerHTML=`<div class="preview-state ${state}">${esc(title)}</div><div class="preview-detail">${esc(detail)}</div>${rule?`<div class="preview-rule">${esc(rule)}</div>`:''}${note?`<div class="preview-note">${esc(note)}</div>`:''}`}
    function previewRoute(){let host;try{host=normalizePreviewHost(document.querySelector('#route-target').value)}catch(error){previewResult('error','无法预览',error.message);return}let runtimeBefore=[];for(let index=0;index<rules.length;index++){let raw=rules[index],model=parseRule(raw),number=index+1;if(model.type==='MATCH'){let note=runtimeBefore.length?`前面有 ${runtimeBefore.length} 条 Geosite、GEOIP 或 IP 规则需要运行时数据判断；若它们未命中，才会落到此兜底规则。`:'没有更早的可匹配规则。';previewResult(runtimeBefore.length?'runtime':'known',runtimeBefore.length?'需要 Mihomo 运行时判断':'确定命中兜底规则',`${host} 最终会使用「${policyLabel(model.policy)}」。`,`第 ${number} 条：${raw}`,note);return}if(domainRuleMatches(model,host)){let note=runtimeBefore.length?`前面有 ${runtimeBefore.length} 条运行时规则；该域名未命中它们时，将命中本条。`:'本条是页面可确定的第一条域名规则。';previewResult(runtimeBefore.length?'runtime':'known',runtimeBefore.length?'可能命中此规则':'确定命中此规则',`${host} 会${actionText(model.policy)}。`,`第 ${number} 条：${raw}`,note);return}if(['GEOSITE','GEOIP','IP-CIDR','IP-CIDR6'].includes(model.type))runtimeBefore.push(raw)}previewResult('runtime','需要 Mihomo 运行时判断',`${host} 未发现可由页面直接判断的域名规则。`,`共扫描 ${rules.length} 条规则`,'Geosite、GEOIP 和 IP 网段会在 Mihomo 获取实际域名分类或解析 IP 后依次匹配；页面不会猜测其结果。')}
    async function api(path,opt={}){let response=await fetch(new URL(path,location.origin),{...opt,headers:{'Content-Type':'application/json','X-CSRF':csrf,...(opt.headers||{})}}),body=await response.json();if(!response.ok)throw Error(body.error||'请求失败');return body}
    function setStatus(message,ok=true){statusEl.textContent=message;statusEl.className='status '+(ok?'':'error')}
    function setDirty(value=true){dirty=value;app.classList.toggle('dirty',dirty);saveButton.disabled=!dirty;countEl.textContent=`${rules.length} 条${dirty?' · 未应用':''}`}
    function renderStructured(rule,index){let model=parseRule(rule),terminal=model.type==='MATCH',locked=protectedRules.has(rule)||terminal,blockDown=index===rules.length-1||rules[index+1]?.toUpperCase().startsWith('MATCH,');if(model.type==='RAW')return renderRaw(rule,index,locked,blockDown,true);let valueHint=model.type==='GEOSITE'?'选择或填写网站分类':model.type==='GEOIP'?'例如 CN':model.type.startsWith('IP-')?'例如 192.168.1.0/24':'例如 example.com';return`<div class="rule-row"><div class="rule-index">${index+1}</div><div class="field"><label>匹配方式</label><select class="control" onchange="editModel(${index},'type',this.value)" ${locked?'disabled':''}>${Object.keys(typeLabels).map(type=>typeOption(type,model.type)).join('')}</select></div><div class="field"><label>匹配内容</label><input class="control" value="${esc(model.value)}" placeholder="${valueHint}" ${model.type==='GEOSITE'?'list="category-options"':''} oninput="editModel(${index},'value',this.value)" ${locked||terminal?'readonly':''}></div><div class="field"><label>访问方式</label><select class="control" onchange="editModel(${index},'policy',this.value)" ${locked?'disabled':''}>${policies.map(policy=>policyOption(policy,model.policy)).join('')}</select></div>${ruleActions(index,terminal,locked,blockDown)}<div class="meaning ${locked?'protected':''}">${esc(explanation(model))}${locked?'<span class="badge">系统保护</span>':''}</div></div>`}
    function renderRaw(rule,index,locked,blockDown,unsupported=false){let terminal=rule.toUpperCase().startsWith('MATCH,');return`<div class="rule-row"><div class="rule-index">${index+1}</div><div class="field raw-field"><label>${unsupported?'复杂规则 · 使用高级语法':'Mihomo 原始规则'}</label><input class="control raw" value="${esc(rule)}" oninput="editRule(${index},this.value)" ${locked?'readonly':''}></div>${ruleActions(index,terminal,locked,blockDown)}<div class="meaning ${locked?'protected':''}">${unsupported?'此规则无法拆成简易表单，仍会原样保留':'高级模式直接编辑 Mihomo 规则文本'}${locked?'<span class="badge">系统保护</span>':''}</div></div>`}
    function ruleActions(index,terminal,locked,blockDown){return`<div class="icon-set"><button class="icon" title="上移" aria-label="上移" onclick="moveRule(${index},-1)" ${index===0||terminal?'disabled':''}>↑</button><button class="icon" title="下移" aria-label="下移" onclick="moveRule(${index},1)" ${blockDown||terminal?'disabled':''}>↓</button><button class="icon danger" title="删除" aria-label="删除" onclick="removeRule(${index})" ${locked?'disabled':''}>×</button></div>`}
    function cardTitle(key){if(key==='__default__')return'默认兜底';if(key==='DIRECT')return'直连与国内服务';return policyLabel(key)}
    function cardSubtitle(key){if(key==='__default__')return'未被前面规则命中的流量';if(key==='DIRECT')return'不经机场，使用本地网络';return`使用「${policyLabel(key)}」出口`}
    function cardBadge(key){if(key==='__default__')return'<span class="route-badge default">默认代理</span>';if(key==='DIRECT')return'<span class="route-badge direct">直连</span>';return`<span class="route-badge">${esc(policyLabel(key))}</span>`}
    function cardEntries(key){return rules.map((raw,index)=>({raw,index,model:parseRule(raw)})).filter(entry=>key==='__default__'?entry.model.type==='MATCH':entry.model.type!=='MATCH'&&entry.model.policy===key)}
    function cardKeys(){let present=[];for(const raw of rules){let model=parseRule(raw),key=model.type==='MATCH'?'__default__':model.policy||'Others';if(!present.includes(key))present.push(key)}let preferred=['DIRECT','AI','Gemini','Youtube','Telegram','Google','Apple','MicroSoft','TikTok','Others','REJECT','REJECT-DROP','PASS'];return present.sort((a,b)=>{let ai=preferred.indexOf(a),bi=preferred.indexOf(b);return(ai<0?999:ai)-(bi<0?999:bi)||a.localeCompare(b)})}
    function cardSummary(entries){return entries.slice(0,2).map(entry=>objectText(entry.model)).join('；')||'尚未添加规则'}
    function renderCards(){let keys=cardKeys();list.className='card-grid';list.innerHTML=keys.length?keys.map(key=>{let entries=cardEntries(key),first=entries[0]?.index+1,last=entries.at(-1)?.index+1,readonly=key==='__default__',encoded=encodeURIComponent(key);return`<article class="rule-card ${key==='DIRECT'?'direct':''} ${readonly?'default':''}"><div class="rule-card-head"><h3>${esc(cardTitle(key))}</h3><p>${esc(cardSubtitle(key))}</p></div><div class="card-facts"><div class="card-fact"><span>规则</span><strong>${entries.length} 条</strong></div><div class="card-fact"><span>出口</span>${cardBadge(key)}</div></div><p class="card-rules">${esc(cardSummary(entries))}</p><div class="card-footer"><span class="card-order">${first?`第 ${first}${first!==last?`–${last}`:''} 条`:''}</span><button class="text-button" type="button" onclick="openCardEditor(decodeURIComponent('${encoded}'))">${readonly?'查看规则':'编辑规则'}</button></div></article>`}).join(''):'<div class="empty">没有规则</div>'}
    function renderCards(){let keys=cardKeys();list.className='card-grid';list.innerHTML=keys.length?keys.map(key=>{let entries=cardEntries(key),first=entries[0]?.index+1,last=entries.at(-1)?.index+1,readonly=key==='__default__',editable=entries.some(entry=>!protectedRules.has(entry.raw)&&entry.model.type!=='MATCH'),encoded=encodeURIComponent(key);return`<article class="rule-card ${key==='DIRECT'?'direct':''} ${readonly?'default':''}"><div class="rule-card-head"><h3>${esc(cardTitle(key))}</h3><p>${esc(cardSubtitle(key))}</p></div><div class="card-facts"><div class="card-fact"><span>规则</span><strong>${entries.length} 条</strong></div><div class="card-fact"><span>出口</span>${cardBadge(key)}</div></div><p class="card-rules">${esc(cardSummary(entries))}</p><div class="card-footer"><span class="card-order">${first?`第 ${first}${first!==last?`–${last}`:''} 条`:''}</span><div class="card-actions"><button class="card-action" type="button" title="${readonly?'查看规则':'编辑规则'}" aria-label="${readonly?'查看规则':'编辑规则'}" onclick="openCardEditor(decodeURIComponent('${encoded}'))">✎</button><button class="card-action danger" type="button" title="${editable?'删除规则':'系统规则不可删除'}" aria-label="${editable?'删除规则':'系统规则不可删除'}" onclick="deleteCardRules(decodeURIComponent('${encoded}'))" ${editable?'':'disabled'}>×</button></div></div></article>`}).join(''):'<div class="empty">没有规则</div>'}
    function render(){if(advanced){list.className='group';list.innerHTML=rules.length?rules.map((rule,index)=>{let terminal=rule.toUpperCase().startsWith('MATCH,'),locked=protectedRules.has(rule)||terminal,blockDown=index===rules.length-1||rules[index+1]?.toUpperCase().startsWith('MATCH,');return renderRaw(rule,index,locked,blockDown)}).join(''):'<div class="empty">没有规则</div>'}else renderCards();setDirty(dirty);renderRuleDialog()}
    function applyData(data){rules=[...data.rules];version=data.version;policies=[...new Set(['DIRECT','Others',...(data.policies||[])])];protectedRules=new Set(data.protected||[]);dirty=false;render();setStatus('规则已载入')}
    async function reloadRules(){if(dirty&&!confirm('放弃尚未应用的修改？'))return;try{applyData(await api('/api/rules'))}catch(error){setStatus(error.message,false)}}
    function toggleAdvanced(value){advanced=value;app.classList.toggle('advanced-mode',advanced);closeRuleDialog();render()}
    function editRule(index,value){rules[index]=value;setDirty()}
    function directAnchor(){return rules.findIndex(rule=>rule.toUpperCase()==='GEOSITE,CN,DIRECT')}
    function insertRule(rule){let isDirect=parseRule(rule).policy==='DIRECT',anchor=isDirect?directAnchor():rules.findIndex(item=>item.toUpperCase().startsWith('MATCH,')),insertAt=anchor<0?rules.length:anchor;rules.splice(insertAt,0,rule);dirty=true;render();if(advanced)requestAnimationFrame(()=>document.querySelectorAll('.rule-row')[insertAt]?.querySelector('input')?.focus())}
    function moveDirectBeforeCn(index){let anchor=directAnchor();if(anchor<0||index<=anchor)return index;let [rule]=rules.splice(index,1);rules.splice(anchor,0,rule);return anchor}
    function editModel(index,key,value){let model=parseRule(rules[index]);if(key==='type'){if(value==='MATCH')model={type:'MATCH',value:'',policy:'Others',extra:[]};else{let defaults={GEOSITE:'openai',GEOIP:'CN','IP-CIDR':'192.168.1.0/24','IP-CIDR6':'2001:db8::/32'};model={type:value,value:model.type==='MATCH'?'':model.value||defaults[value]||'example.com',policy:model.policy||'Others',extra:value.startsWith('IP-')?['no-resolve']:[]}}}else model[key]=value;rules[index]=serialize(model);if(model.policy==='DIRECT')index=moveDirectBeforeCn(index);setDirty();render()}
    function moveRule(index,delta){let target=index+delta;if(target<0||target>=rules.length||rules[target].toUpperCase().startsWith('MATCH,'))return;[rules[index],rules[target]]=[rules[target],rules[index]];dirty=true;render()}
    function removeRule(index){rules.splice(index,1);dirty=true;render()}
    function addRule(){insertRule('DOMAIN-SUFFIX,example.com,Others')}
    function addDirectRule(){insertRule('DOMAIN-SUFFIX,example.com,DIRECT')}
    function dialogStatus(message='',ok=true){let target=document.querySelector('#dialog-status');target.textContent=message;target.className='status '+(ok?'':'error')}
    function closeRuleDialog(){let dialog=document.querySelector('#rule-dialog');if(dialog.open)dialog.close();activeCardKey=null;creatingRule=false;dialogStatus()}
    function openCardEditor(key){activeCardKey=key;creatingRule=false;let dialog=document.querySelector('#rule-dialog');renderRuleDialog();if(!dialog.open)dialog.showModal()}
    function openCreateRule(){activeCardKey=null;creatingRule=true;let dialog=document.querySelector('#rule-dialog');renderRuleDialog();if(!dialog.open)dialog.showModal()}
    function removeCardRule(index){if(protectedRules.has(rules[index])||parseRule(rules[index]).type==='MATCH')return;rules.splice(index,1);dirty=true;render()}
    function deleteCardRules(key){let entries=cardEntries(key),removable=entries.filter(entry=>!protectedRules.has(entry.raw)&&entry.model.type!=='MATCH');if(!removable.length){setStatus('系统保护规则不能删除',false);return}let kept=entries.length-removable.length,message=kept?`删除「${cardTitle(key)}」中的 ${removable.length} 条可编辑规则？系统保护的 ${kept} 条规则会保留。`:`删除「${cardTitle(key)}」中的 ${removable.length} 条规则？`;if(!confirm(message))return;let indexes=new Set(removable.map(entry=>entry.index));rules=rules.filter((_,index)=>!indexes.has(index));dirty=true;render();setStatus(`已删除 ${removable.length} 条规则，点击“校验并应用”后才会生效`)}
    function addRuleToCard(key){if(key==='__default__')return;let policy=key||'Others';insertRule(`DOMAIN-SUFFIX,example.com,${policy}`);activeCardKey=key;creatingRule=false;renderRuleDialog()}
    function createRuleFromDialog(){let type=document.querySelector('#create-type').value,value=document.querySelector('#create-value').value.trim(),policy=document.querySelector('#create-policy').value;if(!value){dialogStatus('请填写匹配内容',false);return}let extra=type.startsWith('IP-')?',no-resolve':'';insertRule(`${type},${value},${policy}${extra}`);creatingRule=false;activeCardKey=policy;dialogStatus('已加入草稿，请校验并应用')}
    function editorRule(entry){let model=entry.model,locked=protectedRules.has(entry.raw)||model.type==='MATCH';if(model.type==='RAW')return`<div class="editor-rule ${locked?'locked':''}"><div class="editor-rule-top"><span class="editor-rule-number">第 ${entry.index+1} 条</span>${locked?'<span class="badge">系统保护</span>':''}</div><p class="editor-note">复杂规则保持原样；如需修改，请开启高级模式。</p><input class="control raw" value="${esc(entry.raw)}" readonly></div>`;return`<div class="editor-rule ${locked?'locked':''}"><div class="editor-rule-top"><span class="editor-rule-number">第 ${entry.index+1} 条</span>${locked?'<span class="badge">系统保护</span>':''}</div><div class="editor-fields"><div class="field"><label>匹配方式</label><select class="control" onchange="editModel(${entry.index},'type',this.value)" ${locked?'disabled':''}>${Object.keys(typeLabels).map(type=>typeOption(type,model.type)).join('')}</select></div><div class="field"><label>匹配内容</label><input class="control" value="${esc(model.value)}" ${model.type==='GEOSITE'?'list="category-options"':''} oninput="editModel(${entry.index},'value',this.value)" ${locked?'readonly':''}></div><div class="field"><label>访问方式</label><select class="control" onchange="editModel(${entry.index},'policy',this.value)" ${locked?'disabled':''}>${policies.map(policy=>policyOption(policy,model.policy)).join('')}</select></div></div>${locked?'<p class="editor-note">系统规则用于保护国内直连或默认兜底，不能删除或改写。</p>':`<div class="editor-actions"><button class="text-button" type="button" onclick="removeCardRule(${entry.index})">删除此规则</button></div>`}</div>`}
    function renderRuleDialog(){let title=document.querySelector('#rule-dialog-title'),description=document.querySelector('#rule-dialog-description'),body=document.querySelector('#rule-dialog-body');if(creatingRule){title.textContent='新增规则';description.textContent='先选择匹配方式、填写对象，再选择访问出口；规则会保持在安全的默认位置。';body.innerHTML=`<div class="create-form"><div class="field"><label>匹配方式</label><select id="create-type" class="control">${['DOMAIN','DOMAIN-SUFFIX','DOMAIN-KEYWORD','GEOSITE','IP-CIDR','IP-CIDR6','GEOIP'].map(type=>typeOption(type,'DOMAIN-SUFFIX')).join('')}</select></div><div class="field"><label>匹配内容</label><input id="create-value" class="control" placeholder="例如 example.com"></div><div class="field"><label>访问方式</label><select id="create-policy" class="control">${policies.map(policy=>policyOption(policy,'Others')).join('')}</select></div></div><p class="editor-note" style="margin-top:14px">域名与子域名适合填写根域名；直连规则会自动放在通用中国规则之前，其他规则会放在默认兜底之前。</p><div class="editor-actions"><button class="button primary" type="button" onclick="createRuleFromDialog()">加入草稿</button></div>`;return}if(!activeCardKey)return;let entries=cardEntries(activeCardKey),readonly=activeCardKey==='__default__',encoded=encodeURIComponent(activeCardKey);title.textContent=readonly?'查看默认兜底规则':`编辑：${cardTitle(activeCardKey)}`;description.textContent=readonly?'这是最后一条默认规则，只在其他规则都未命中时使用，不能改写。':'规则顺序保持不变；修改后请点击“校验并应用”保存到 Mihomo。';body.innerHTML=`${!readonly?'<p class="editor-note">需要新增同一出口的规则，可直接加入；若要调整跨卡片的优先级，请使用高级模式。</p>':''}${entries.map(editorRule).join('')||'<div class="empty">此出口暂时没有规则</div>'}${!readonly?`<div class="editor-actions"><button class="button secondary" type="button" onclick="addRuleToCard(decodeURIComponent('${encoded}'))">新增此出口规则</button></div>`:''}`}
    async function saveRules(fromDialog=false){if(!dirty){if(fromDialog)dialogStatus('没有需要应用的修改');return}if(!confirm(`应用当前 ${rules.length} 条代理规则？`))return;saveButton.disabled=true;setStatus('正在校验并应用…');if(fromDialog)dialogStatus('正在校验并应用…');try{applyData(await api('/api/rules',{method:'POST',body:JSON.stringify({rules,version})}));setStatus('规则已通过校验并生效');if(fromDialog){dialogStatus('规则已通过校验并生效');setTimeout(closeRuleDialog,500)}}catch(error){setStatus(error.message,false);if(fromDialog)dialogStatus(error.message,false);saveButton.disabled=false}}
    document.querySelector('#route-target').addEventListener('keydown',event=>{if(event.key==='Enter')previewRoute()});
    reloadRules();
  </script>
</body>
</html>
